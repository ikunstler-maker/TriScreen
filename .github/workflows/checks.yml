name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: HTML structure
        run: npx --yes html-validate@8 -f text $(ls *.html | grep -v '^google') entrolog/index.html
      - name: Local links
        run: node scripts/check-links.mjs $(ls *.html | grep -v '^google') entrolog/index.html
      - name: No merge conflict markers
        run: "! grep -rnE '^(<<<<<<<|>>>>>>>) ' --include='*.html' --include='*.md' --include='*.mjs' ."

<!doctype html>
<html lang="uk" id="html-root" class="dark">

    <meta charset="UTF-8" />

    <title>EntroLog — TriScreen</title>

    <!-- Tailwind CSS (для ідентичного відображення кнопки та теми TriScreen) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Синхронізація теми з TriScreen -->
    <script>
      if (!localStorage.getItem('theme')) {
          localStorage.setItem('theme', 'dark');
          document.documentElement.classList.add('dark');
      } else if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
      } else {
          document.documentElement.classList.remove('dark');
      }
      if (window.tailwind) {
          tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
      }
      function toggleTheme() {
          const html = document.documentElement;
          html.classList.toggle('dark');
          localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
      }
    </script>

    <!-- Оригінальні скрипти та стилі React-додатку EntroLog -->
    <script type="module" crossorigin src="/TriScreen/entrolog/assets/index-R_PGdS44.js"></script>

                    <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
